<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#06070a" />
    <meta name="description" content="VOLTGRAVE: an endless low-poly FPS roguelite. Fight room to room through a procedurally generated machine." />
    <title>VOLTGRAVE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306070a'/%3E%3Cpath d='M18 3L7 18h7l-2 11 11-15h-7z' fill='%233ef0d0'/%3E%3C/svg%3E" />
    <style>
      /* Boot screen: shown while the game bundle loads. Selectors are 'html body #boot' so they win
         over the bundled stylesheet (linked after this block); it fades out when main.js adds .gone. */
      html, body { margin: 0; height: 100%; background: #06070a; }
      html body #boot {
        position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px;
        background:
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at 50% 46%, #121a20 0%, #080a0e 58%, #030405 100%);
        color: #7fe0b8; font: 22px/1.2 VT323, 'Courier New', monospace; letter-spacing: 0.3em; text-align: center;
        opacity: 1; transition: opacity 0.3s ease-out, visibility 0s linear 0s;
        -webkit-font-smoothing: none;
      }
      html body #boot.gone { display: grid; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease-out, visibility 0s linear 0.3s; }
      #boot .bt { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; }
      #boot .bt-bolt { width: 34px; height: 34px; filter: drop-shadow(0 0 6px rgba(62, 240, 208, 0.55)); animation: bt-flicker 2.4s steps(1) infinite; }
      #boot .bt-logo {
        font: 700 clamp(44px, 11vw, 96px)/0.9 'Libre Caslon Condensed', 'Times New Roman', Times, serif;
        letter-spacing: 0.04em; color: #eeeae0;
        text-shadow: -2px 0 rgba(255, 49, 80, 0.75), 2px 0 rgba(62, 240, 208, 0.75), 0 0 24px rgba(127, 224, 184, 0.18);
      }
      #boot .bt-sub { font-size: 15px; letter-spacing: 0.42em; color: #8a8f98; margin-top: -4px; padding-left: 0.42em; }
      #boot .bt-bar { position: relative; width: min(260px, 64vw); height: 4px; margin-top: 18px; background: #12171c; box-shadow: 0 0 0 1px #1e2a30; overflow: hidden; }
      #boot .bt-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 34%; background: #3ef0d0; box-shadow: 0 0 10px #3ef0d0; animation: bt-sweep 1.1s steps(18) infinite; }
      #boot .bt-msg { font-size: 16px; color: #5f8f80; padding-left: 0.3em; }
      #boot .bt-msg::after { content: '_'; animation: bt-blink 0.8s steps(1) infinite; }
      @keyframes bt-sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @keyframes bt-blink { 50% { opacity: 0; } }
      @keyframes bt-flicker { 0%, 100% { opacity: 1; } 47% { opacity: 0.35; } 49% { opacity: 1; } 51% { opacity: 0.6; } 53% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .bt-bolt, #boot .bt-msg::after { animation: none; }
        #boot .bt-bar i { animation: none; width: 100%; opacity: 0.6; }
      }
      @media (max-height: 420px) { #boot .bt { gap: 8px; } #boot .bt-bar { margin-top: 10px; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="touch"></div>
    <div id="menus"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="bt">
        <svg class="bt-bolt" viewBox="0 0 32 32" aria-hidden="true"><path d="M18 3L7 18h7l-2 11 11-15h-7z" fill="#3ef0d0" /></svg>
        <div class="bt-logo">VOLTGRAVE</div>
        <div class="bt-sub">A DESCENT INTO THE GRID</div>
        <div class="bt-bar" aria-hidden="true"><i></i></div>
        <div class="bt-msg">CHARGING THE GRID</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
